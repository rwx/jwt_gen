apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwt-gen-deployment
  labels:
    app: jwt-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwt-gen
  template:
    metadata:
      labels:
        app: jwt-gen
    spec:
      containers:
      - name: jwt-gen
        image: gcr.io/[PROJECT-ID]/jwt-gen:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: jwt-gen-service
spec:
  selector:
    app: jwt-gen
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
